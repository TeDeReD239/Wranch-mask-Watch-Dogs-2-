[env:m5stick-c]
platform = espressif32@6.1.0
board = m5stick-c
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    me-no-dev/AsyncTCP @ ^1.1.1